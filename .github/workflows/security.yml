name: Security & Quality Audit (ECC)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security & Integrity Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify JavaScript syntax
        run: node --check app.js adminDashboard.js sw.js db.js supabaseClient.js

      - name: Verify no private service role key leaked
        run: |
          node -e '
            const fs = require("fs");
            const files = ["app.js", "adminDashboard.js", "db.js", "supabaseClient.js", "sw.js", "index.html", "style.css", "package.json", "vercel.json"];
            const forbidden = "service" + "_" + "role";
            for (const f of files) {
              if (fs.existsSync(f)) {
                const c = fs.readFileSync(f, "utf-8");
                if (c.toLowerCase().includes(forbidden)) {
                  console.error("::error::Forbidden secret detected in " + f);
                  process.exit(1);
                }
              }
            }
            console.log("✅ Verified: no private service role keys found in client files");
          '

      - name: Verify vercel.json format and security headers
        run: |
          node -e "
            const cfg = require('./vercel.json');
            if (!cfg.headers || !Array.isArray(cfg.headers)) throw new Error('Missing headers in vercel.json');
            const globalRule = cfg.headers.find(h => h.source === '/(.*)');
            if (!globalRule) throw new Error('Missing global header rule in vercel.json');
            const keys = globalRule.headers.map(h => h.key);
            ['X-Content-Type-Options', 'X-Frame-Options', 'Content-Security-Policy'].forEach(k => {
              if (!keys.includes(k)) throw new Error('Missing critical security header: ' + k);
            });
            console.log('✅ vercel.json security headers validated successfully');
          "
